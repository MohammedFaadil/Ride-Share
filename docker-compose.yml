# Convenience Postgres instance for local development only.
# Not used in production — Render provisions its own managed Postgres
# (see render.yaml). Run: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: roamly
      POSTGRES_PASSWORD: roamly
      POSTGRES_DB: roamly
    ports:
      - "5432:5432"
    volumes:
      - roamly_pgdata:/var/lib/postgresql/data

volumes:
  roamly_pgdata:
